[package]
name = "birdbot-rs"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dotenvy = "0.15"
tracing = "0.1"
rand = "0.10"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
chrono = "0.4"
diesel_migrations = "2.3"
serde = "1.0"
rosu-v2 = { git = "https://github.com/MaxOhn/rosu-v2", rev = "81499781b5a8a73012eb0d60e7742b36eaf7d2f8", features = ["metrics"] }
num-format = "0.4"
time = "0.3"
dashmap = "7.0.0-rc2"
rosu-pp = { git = "https://github.com/MaxOhn/rosu-pp", rev = "072ed255fa043aba495212c441030dc7a5e61469"}
regex = "1.13"
url = "2.5"
diesel = { version = "2.3", features = ["chrono"] }
diesel-async = { version = "0.9", features = ["postgres", "mobc", "migrations"] }
mobc = "0.9"
markov = "1.1"
tokio-stream = "0.1"
par-stream = { version = "0.10", features = ["runtime-tokio"] }
itertools = "0.15"
resvg = "0.48"
svg = "0.18"
base64 = "0.23"
color_space = "0.5"
image = "0.25"
serde_json = "1.0"
aformat = "0.1"
to-arraystring = { version = "0.2", features = ["nonzero_impls"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
metrics-exporter-prometheus = "0.18"
rustls = "0.23"
foldhash = "0.2"
tokio-util = { version = "0.7", features = ["time"] }

[dependencies.tokio]
version = "1.53"
features = ["full"]

[dependencies.reqwest]
version = "0.13"
default-features=false
features = ["rustls", "zstd", "brotli", "gzip", "deflate", "http2"]

[dependencies.poise]
git = "https://github.com/serenity-rs/poise"
rev = "a1d0e3ee23e0a95b1192378acad27fa51a2bb8f0"

[dependencies.symphonia]
version = "0.5"
features = ["all-codecs"]

[dependencies.songbird]
git = "https://github.com/KiloOscarSix/songbird"
rev = "5308e6ebc631522c3c633ba197adaa9d6950f962"
features = ["builtin-queue"]

[dependencies.serenity]
git = "https://github.com/serenity-rs/serenity"
branch = "next"
default-features = false
features = ["builder", "framework", "cache", "gateway", "http", "model", "utils", "rustls_backend", "voice",
    "transport_compression_zlib", "transport_compression_zstd"]

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.7"

[profile.dev]
lto = "off"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "debuginfo"

[profile.release.build-override]
opt-level = 3
[profile.release.package."*"]
opt-level = 3

